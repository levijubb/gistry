name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags + GitHub releases
      issues: write # release labels
      pull-requests: write # open/update the release PR
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  package:
    name: Package VSIX
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the VSIX to the release
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
    env:
      VSIX: gistry-${{ needs.release-please.outputs.version }}.vsix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vsce package --no-dependencies --out "$VSIX"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.VSIX }}
      - name: Attach VSIX to the GitHub release
        run: gh release upload "$TAG" "$VSIX" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: ${{ env.VSIX }}
          if-no-files-found: error

  publish:
    name: Publish to ${{ matrix.registry.name }}
    needs: [release-please, package]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ matrix.registry.url }}
    permissions:
      contents: read
      id-token: write # OIDC token for marketplace trusted publishing
    strategy:
      fail-fast: false
      matrix:
        registry:
          - name: VS Code Marketplace
            url: https://marketplace.visualstudio.com/items?itemName=gistry.gistry
            cli: vsce
            auth: --oidc
          - name: Open VSX
            url: https://open-vsx.org/extension/gistry/gistry
            cli: ovsx
            auth: --trusted-publishing
    env:
      VSIX: gistry-${{ needs.release-please.outputs.version }}.vsix
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the locked vsce / ovsx
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Publish
        run: npx "$CLI" publish "$AUTH" --packagePath "$VSIX" --skip-duplicate
        env:
          CLI: ${{ matrix.registry.cli }}
          AUTH: ${{ matrix.registry.auth }}
