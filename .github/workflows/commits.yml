name: Commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # list the PR's commits

jobs:
  conventional:
    # PRs are rebase-merged, so every commit lands on main as-is and release-please reads each one.
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - name: Check every commit message
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          pattern='^(feat|fix|perf|revert|docs|refactor|test|build|ci|chore|style)(\([^()]+\))?!?: [^A-Z].*$'
          bad=0
          while IFS=$'\t' read -r sha subject; do
            if [[ "$subject" =~ $pattern ]]; then
              echo "ok    ${sha:0:7} $subject"
            else
              echo "::error::${sha:0:7} \"$subject\" is not a conventional commit, e.g. \"fix(graph): misaligned merge curve\" (lowercase subject)."
              bad=1
            fi
          done < <(gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[] | [.sha, (.commit.message | split("\n")[0])] | @tsv')
          exit "$bad"
